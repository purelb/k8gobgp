apiVersion: bgp.purelb.io/v1
kind: BGPConfiguration
metadata:
  name: basic-bgp-config
  namespace: k8gobgp-system
spec:
  global:
    asn: 64512
    listenPort: 179
    families:
      - "ipv4-unicast"
      - "ipv6-unicast"

  neighbors:
    # Simple neighbor (no nodeSelector — applied to all nodes)
    - config:
        neighborAddress: "192.168.1.254"
        peerAsn: 64513
        description: "Upstream router"
      afiSafis:
        - family: "ipv4-unicast"
          enabled: true
      timers:
        config:
          holdTime: 90
          keepaliveInterval: 30
      # Recommended in production. Without it, a pod restart sends
      # CEASE/PEER_DECONFIGURED on shutdown and the upstream router purges this
      # node's routes immediately - so a rolling update blackholes each node for
      # as long as it takes the replacement pod to re-establish. With it the
      # router holds the routes for restartTime seconds instead.
      gracefulRestart:
        enabled: true
        restartTime: 120
      # Filter which communities are advertised to this peer, applied AFTER the
      # export policy. Omit to leave gobgpd alone.
      #
      # "none" is not literal: large communities, LLGR markers, and every family
      # except IPv4/IPv6 unicast survive it. And note "none"/"extended" strip
      # NO_EXPORT and NO_ADVERTISE, so the far side loses the do-not-re-export
      # signal - a route-leak vector. See README.md.
      sendCommunity: "both"

    # IPv4 peer targeted to a specific subnet using nodeSelector
    - config:
        neighborAddress: "172.30.250.1"
        peerAsn: 64513
        description: "Router on subnet-250"
      nodeSelector:
        matchLabels:
          network.example.com/subnet: "250"
      afiSafis:
        - family: "ipv4-unicast"
          enabled: true

    # IPv6 peer targeted to a different subnet
    - config:
        neighborAddress: "fd00:251::1"
        peerAsn: 64513
        description: "Router on subnet-251"
      nodeSelector:
        matchLabels:
          network.example.com/subnet: "251"
      afiSafis:
        - family: "ipv6-unicast"
          enabled: true

    # BFD. Timers are MICROSECONDS: 1000000 is one second, and detection time is
    # requiredMinimumReceive x detectionMultiplier, so this is 3s.
    #
    # Two things to know before enabling it:
    #   - A BFD state transition is a HARD BGP reset, not a graceful one, and
    #     changing any BFD field tears the session down and rebuilds it. Apply
    #     BFD changes in a maintenance window.
    #   - Sub-second profiles are not viable under this DaemonSet's default CPU
    #     limit. See README.md; the 300ms floor needs requests.cpu == limits.cpu.
    - config:
        neighborAddress: "172.30.252.1"
        peerAsn: 64513
        description: "Router on subnet-252, with BFD"
      afiSafis:
        - family: "ipv4-unicast"
          enabled: true
      bfd:
        enabled: true
        desiredMinimumTxInterval: 1000000
        requiredMinimumReceive: 1000000
        detectionMultiplier: 3

    # IPv6 unnumbered peer (interface-based, no neighborAddress needed)
    # RFC 5549 Extended Next-Hop capability is negotiated automatically
    # by GoBGP when neighborInterface is set with ipv4-unicast.
    - config:
        neighborInterface: "eth1"
        peerAsn: 64514
        description: "Spine switch via unnumbered BGP"
      nodeSelector:
        matchLabels:
          network.example.com/role: "leaf"
      afiSafis:
        - family: "ipv4-unicast"
          enabled: true
        - family: "ipv6-unicast"
          enabled: true
