name: CI

on:
  push:
    # All branches. The previous [main, feature/*] list meant a push to any
    # other prefix - fix/, chore/, deps/ - ran nothing at all, so the first
    # signal arrived only when the PR was opened. Branches are cheap to run and
    # the feedback is worth more on the branch than at review time.
    branches: ['**']
  pull_request:
    branches: [main]

# Running on every branch means rapid successive pushes queue redundant runs, so
# supersede them. Never cancel on main: those runs gate the ruleset and a
# cancelled one reads as a failure.
#
# This does not dedupe the push and pull_request runs for the same commit -
# their github.ref differs, so they land in different groups. That duplication
# is the price of getting a signal before the PR exists.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GO_VERSION: "1.26"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned deliberately. "latest" silently adopts each new golangci-lint
          # release, so a green PR can turn red overnight with no repo change —
          # which is exactly how an SA1019 failure landed on main. Bump this
          # explicitly, and keep it in step with the version run locally.
          version: v2.13.2
          args: --timeout=5m

      # The alert rules are a sample operators import, so a typo in them fails at
      # their Prometheus rather than ours. promtool parses and type-checks the
      # expressions, which catches a malformed selector or an aggregation over a
      # label that cannot exist.
      #
      # The file is a PrometheusRule, so .spec is extracted first - promtool wants
      # the bare `groups:` form. Both are checked: the PodMonitors only need to be
      # valid YAML with the fields the Operator reads, which yq covers.
      - name: Check the alert rules and monitoring samples
        run: |
          set -euo pipefail
          PROM_VERSION=3.6.0
          curl -sSfL "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz" \
            | tar xz --strip-components=1 -C /usr/local/bin "prometheus-${PROM_VERSION}.linux-amd64/promtool"
          python3 -c "
          import yaml, sys
          docs = [d for d in yaml.safe_load_all(open('docs/alerting/k8gobgp-alerts.yaml')) if d]
          assert len(docs) == 1 and docs[0]['kind'] == 'PrometheusRule', 'unexpected shape'
          yaml.safe_dump(docs[0]['spec'], open('/tmp/rules.yaml', 'w'))
          "
          promtool check rules /tmp/rules.yaml
          python3 -c "
          import yaml
          docs = [d for d in yaml.safe_load_all(open('docs/monitoring/podmonitors.yaml')) if d]
          assert len(docs) == 2, f'expected two PodMonitors, got {len(docs)}'
          for d in docs:
              assert d['kind'] == 'PodMonitor', d['kind']
              ep = d['spec']['podMetricsEndpoints'][0]
              rl = ep['relabelings']
              # Both are load-bearing: without an explicit job the alert rules'
              # matchers select nothing, and without node the one cross-endpoint
              # rule can never match.
              assert any(r.get('targetLabel') == 'job' for r in rl), d['metadata']['name'] + ': no job relabeling'
              assert any(r.get('targetLabel') == 'node' for r in rl), d['metadata']['name'] + ': no node relabeling'
          print('podmonitors ok')
          "

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        run: go build -v ./...

      - name: Verify vendor
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code go.mod go.sum

      # Nothing else checks that the committed CRDs and RBAC still match the Go
      # types they are generated from, and release.yaml builds dist/crds.yaml by
      # concatenating the committed YAML — so a change to api/v1/types.go with no
      # "make manifests" ships a stale schema in the release artifact.
      # Deterministic because the Makefile pins controller-gen to the version
      # stamped into config/crd/bases/*.yaml.
      - name: Verify generated manifests
        run: |
          make generate
          make manifests
          git diff --exit-code api/v1/zz_generated.deepcopy.go config/crd/bases config/rbac

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build Docker image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          # load: true puts the image in the local Docker store. Without it the
          # result stays in the BuildKit cache under the docker-container driver
          # and the assertions below cannot find an image to run.
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Two things a static pin check cannot see: that the daemon we shipped is
      # the commit we pinned, and that it accepts the flags entrypoint.sh passes.
      # The second one matters - gobgpd exits 1 on an unknown flag and
      # entrypoint.sh backgrounds it, so the symptom is "Timeout waiting for
      # gobgpd to start" on every node, naming neither the flag nor the version.
      - name: Assert the built gobgpd matches the pin and accepts its flags
        run: |
          set -euo pipefail
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci-${{ github.sha }}"
          sha=$(grep -oPm1 '(?<=^ARG GOBGP_COMMIT=)[0-9a-f]{40}$' Dockerfile)
          [ -n "$sha" ] || { echo "no GOBGP_COMMIT in Dockerfile"; exit 1; }
          # --entrypoint, or this runs entrypoint.sh and starts the daemon
          # instead of asking it for its version.
          docker run --rm --entrypoint gobgpd "$IMG" --version
          docker run --rm --entrypoint gobgpd "$IMG" --version | grep -q "commit: ${sha:0:7}"
          docker run --rm --entrypoint gobgpd "$IMG" --help 2>&1 | grep -q -- --metrics-host
          docker run --rm --entrypoint gobgpd "$IMG" --help 2>&1 | grep -q -- --pprof-disable

      # Round-trip the converters against the real daemon.
      #
      # This is the check that catches the bug class nothing else does: a field
      # the CR omits, that gobgpd defaults or normalises and echoes back
      # differently, so the comparator says "changed" on every reconcile and
      # UpdatePeer fires forever. Two of those reached production (connectRetry,
      # localAsn) with the unit suite green, because the fake it compares
      # against encodes what its author believed the daemon does.
      #
      # It needs a real gobgpd, which is why it lives in this job rather than
      # `test` - the image is already built and loaded here.
      - name: Round-trip the converters against a real gobgpd
        run: |
          set -euo pipefail
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci-${{ github.sha }}"
          # --api-insecure-allow-remote is required from gobgp-netlink v1.3.5.
          # The daemon refuses to start when --api-hosts is off-loopback without
          # client-certificate authentication, because the API is a write
          # interface - it adds peers and paths and installs routes into the host
          # routing table. Binding the wildcard is unavoidable here: the test
          # runs on the host and reaches the daemon through the published port,
          # so a loopback bind inside the container would be unreachable.
          #
          # This is the exposure the flag exists to accept deliberately: a
          # throwaway container on the runner's bridge network, reachable only
          # from the runner, deleted in the next step. The alternative -
          # --network host with a loopback bind - keeps the guard but binds the
          # runner's own port 179 and shares its network namespace, which is a
          # larger change than the isolation is worth here.
          #
          # The shipped image does NOT hit this: entrypoint.sh binds a unix
          # socket by default, and USE_UNIX_SOCKET defaults to true.
          docker run -d --name gobgpd-rt -p 50051:50051 --entrypoint gobgpd "$IMG" \
            --api-hosts 0.0.0.0:50051 --pprof-disable --api-insecure-allow-remote
          for i in $(seq 1 30); do
            docker exec gobgpd-rt gobgp -u 127.0.0.1 global 2>/dev/null && break || sleep 1
          done
          go test -tags=gobgpd -count=1 -v ./controllers/ -run TestRoundTrip
        env:
          GOBGPD_ADDR: 127.0.0.1:50051

      - name: gobgpd logs on failure
        if: failure()
        run: docker logs gobgpd-rt 2>&1 | tail -50

  # Static analysis of our own source. Deterministic for a pinned gosec version,
  # so this is a genuine property of the diff and stays a required check.
  # Dependency vulnerability scanning lives in vulnerability-scan.yaml: it runs
  # against a database fetched at run time, so it can fail with no repo change
  # and must not gate a merge.
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run gosec
        uses: securego/gosec@deb54465fea23d19a77f037e11e6589021f8501d # v2.29.0
        with:
          args: -exclude-dir=vendor ./...

  # Combined status check for branch protection rules
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [lint, test, build, docker-build, security]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.docker-build.result }}" != "success" ]] || \
             [[ "${{ needs.security.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All jobs passed"
